stages:
  parse_corpus:
    cmd: python scripts/01_parse_corpus.py
    deps:
      - scripts/01_parse_corpus.py
    outs:
      - features/manifest.csv
  
  extract_acoustics:
    cmd: python scripts/02_extract_acoustics.py
    deps:
      - scripts/02_extract_acoustics.py
      - features/manifest.csv
    params:
      - acoustics.max_formant_female
      - acoustics.max_formant_male
      - acoustics.n_formants
      - acoustics.long_vowel_threshold_ms
    outs:
      - features/features_acoustic.csv
      - features/missing_values_report.csv
  
  extract_neural_whisper:
    cmd: python scripts/03_extract_whisper.py
    deps:
      - scripts/03_extract_whisper.py
      - features/manifest.csv
    params:
      - whisper.model_id
      - whisper.target_layers
    outs:
      - features/features_whisper.npz
  
  extract_neural_xlsr:
    cmd: python scripts/04_extract_xlsr.py
    deps:
      - scripts/04_extract_xlsr.py
      - features/manifest.csv
    params:
      - xlsr.model_id
      - xlsr.target_layers
    outs:
      - features/features_xlsr.npz
  
  normalise:
    cmd: python scripts/05_normalise.py
    deps:
      - scripts/05_normalise.py
      - features/features_acoustic.csv
      - features/features_whisper.npz
      - features/features_xlsr.npz
    params:
      - normalisation.pca_dim_viz
      - normalisation.pca_dim_cluster
    outs:
      - features/features_acoustic_norm.csv
      - features/features_whisper_norm.npz
      - features/features_xlsr_norm.npz

  acoustic_analyse:
    cmd: python scripts/06_acoustic_features_analysis.py
    deps:
      - scripts/06_acoustic_features_analysis.py
      - features/features_acoustic_norm.csv
    outs:
      - results/5/summary_statistics.csv
      - results/5/variance_decomposition.csv
      - results/5/fig_vowel_space.png
      - results/5/fig_boxplots.png
      - results/5/fig_intra_speaker.png
  
  analyse_neural:
    cmd: python scripts/07_neural_analysis.py
    deps:
      - scripts/07_neural_analysis.py
      - features/features_acoustic_norm.csv
      - features/features_whisper_norm.npz
      - features/features_xlsr_norm.npz
    outs:
      - results/5/neural_metrics_comparison.csv
  
  rsa_mantel:
    cmd: python scripts/08_rsa_mantel.py
    deps:
      - scripts/08_rsa_mantel.py
      - features/features_acoustic_norm.csv
      - features/features_whisper_norm.npz
      - features/features_xlsr_norm.npz
    outs:
      - results/5/rsa_mantel_results.csv
  
  group comparisons:
    cmd: python scripts/09_group_comparisons.py
    deps:
      - scripts/09_group_comparisons.py
      - features/features_acoustic_norm.csv
      - features/features_whisper_norm.npz
    outs:
      - results/6/stat_acoustic_l1_l2.csv
      - results/6/stat_gender_residual.csv
      - results/6/stat_neural_l1_l2.csv
      - results/6/fig_qq_plots.png
  
  inter_phoneme_distances:
    cmd: python scripts/10_inter_phoneme_dist.py
    deps:
      - scripts/10_inter_phoneme_dist.py
      - features/features_acoustic_norm.csv
      - features/features_whisper_norm.npz
      - features/features_xlsr_norm.npz
    outs:
      - results/6/dist_mantel_results.csv
      - results/6/dist_bootstrap_ci.csv
      - results/6/clf_performance.csv
      - results/6/clf_statistical_tests.csv
      - results/6/fig_confusion_matrix_whisper.png