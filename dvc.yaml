stages:
  parse_corpus:
    cmd: python scripts/01_parse_corpus.py
    deps:
      - scripts/01_parse_corpus.py
    outs:
      - features/manifest.csv
  
  extract_acoustics:
    cmd: python scripts/02_extract_acoustics.py
    deps:
      - scripts/02_extract_acoustics.py
      - features/manifest.csv
    params:
      - acoustics.max_formant_female
      - acoustics.max_formant_male
      - acoustics.n_formants
      - acoustics.long_vowel_threshold_ms
    outs:
      - features/features_acoustic.csv
      - features/missing_values_report.csv
  
  extract_neural_whisper:
    cmd: python scripts/03_extract_whisper.py
    deps:
      - scripts/03_extract_whisper.py
      - features/manifest.csv
    params:
      - whisper.model_id
      - whisper.target_layers
    outs:
      - features/features_whisper.npz
  
  extract_neural_xlsr:
    cmd: python scripts/04_extract_xlsr.py
    deps:
      - scripts/04_extract_xlsr.py
      - features/manifest.csv
    params:
      - xlsr.model_id
      - xlsr.target_layers
    outs:
      - features/features_xlsr.npz